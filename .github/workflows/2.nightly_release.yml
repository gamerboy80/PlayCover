name: Build nightly release
on:
  workflow_dispatch:
  push:
    branches:
      - develop
env:
  CI: true
jobs:
  build:
    runs-on: macos-latest
    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        shell: bash
        run: |
          brew install swiftlint carthage
          npm install https://github.com/PlayCover/create-dmg

      - name: Build with ad hoc signing
        shell: bash
        run: bash scripts/build-app.sh Nightly "${{ github.run_number }}"

      - name: Create DMG
        shell: bash
        run: |
          npx create-dmg ./output/PlayCover.app ./output --no-code-sign
          mv ./output/*.dmg ./output/PlayCover_nightly_${{ github.run_number }}.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PlayCover_nightly_${{ github.run_number }}.dmg
          path: output/PlayCover_nightly_${{ github.run_number }}.dmg
