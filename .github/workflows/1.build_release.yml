name: Build & Release macOS App
on:
  workflow_dispatch:
  push:
    tags:
      - "*"
env:
  CI: true
jobs:
  build:
    runs-on: macos-latest
    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get the version
        id: tag_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=manual_${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        shell: bash
        run: |
          brew install swiftlint carthage
          npm install https://github.com/PlayCover/create-dmg

      - name: Build with ad hoc signing
        shell: bash
        run: bash scripts/build-app.sh Release

      - name: Create DMG
        shell: bash
        run: |
          npx create-dmg ./output/PlayCover.app ./output --no-code-sign
          mv ./output/*.dmg ./output/PlayCover_${{ env.TAG_NAME }}.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PlayCover_${{ env.TAG_NAME }}.dmg
          path: output/PlayCover_${{ env.TAG_NAME }}.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            output/PlayCover_${{ env.TAG_NAME }}.dmg
